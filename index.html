<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KinoHub Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f0f12;
      color: #ffffff;
      padding: 12px;
    }
    header h1 { font-size: 22px; color: #e50914; text-align: center; margin-bottom: 15px; }
    .section-title {
      font-size: 16px;
      margin: 15px 0 10px 0;
      color: #ff9800;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: #181820;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #252530;
      position: relative;
    }
    .badge-new {
      position: absolute;
      top: 6px;
      left: 6px;
      background: #e50914;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background-color: #222;
    }
    .card-info {
      padding: 8px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }
    .card-title { font-size: 13px; font-weight: bold; margin-bottom: 6px; }
    .btn {
      background: #e50914;
      color: #fff;
      border: none;
      padding: 6px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎬 KINOHUB</h1>
  </header>

  <!-- 24 soat ichida qo'shilganlar -->
  <div id="newSection" style="display: none;">
    <div class="section-title">🔥 Yangi premyeralar (24 soat)</div>
    <div class="grid" id="newMovies"></div>
  </div>

  <!-- Barcha kinolar -->
  <div class="section-title">🍿 Barcha kinolar va seriallar</div>
  <div class="grid" id="allMovies"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Bot serveringizning ochiq IP yoki domeni (masalan: http://SERVER_IP:8080/api/movies)
    const API_URL = "http://SIZNING_SERVER_IP:8080/api/movies";

    async function loadData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        const newContainer = document.getElementById("newMovies");
        const allContainer = document.getElementById("allMovies");
        const newSection = document.getElementById("newSection");

        newContainer.innerHTML = "";
        allContainer.innerHTML = "";

        let hasNew = false;

        data.forEach(item => {
          const cardHtml = `
            <div class="card">
              ${item.is_new ? '<span class="badge-new">YANGI</span>' : ''}
              <img src="${item.poster}" alt="${item.title}">
              <div class="card-info">
                <div class="card-title">${item.title}</div>
                <button class="btn" onclick="sendToBot(${item.code})">Ko'rish</button>
              </div>
            </div>
          `;

          // Agar 24 soat ichida qo'shilgan bo'lsa
          if (item.is_new) {
            hasNew = true;
            newContainer.innerHTML += cardHtml;
          }

          // Umumiy ro'yxatga ham qo'shamiz
          allContainer.innerHTML += cardHtml;
        });

        if (hasNew) newSection.style.display = "block";

      } catch (err) {
        console.error("Xatolik:", err);
      }
    }

    function sendToBot(code) {
      tg.sendData(code.toString());
    }

    loadData();
  </script>
</body>
</html>
